name: Apply PR99 payload
on:
  push:
    branches: [feat/store-achv-narration]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and apply payload
        run: |
          set -e
          base64 -d payloads/pr99-wts.tar.gz.b64 > /tmp/p.tar.gz
          tar -xzf /tmp/p.tar.gz -C .
      - name: Commit applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply PR99 payload [skip ci]" || echo "nothing to commit"
          git push
