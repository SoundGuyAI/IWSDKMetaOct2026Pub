name: Decode prerecorded voice clips
on:
  push:
    branches: [main]
    paths:
      - 'public/audio/*voice-clips-*.tar.gz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract voice clips
        run: |
          set -e
          mkdir -p public/audio/speech
          for first in public/audio/*voice-clips-*.tar.gz.b64.part000; do
            [ -e "$first" ] || continue
            archive="${first%.part000}"
            cat "$archive".part* > "$archive"
            rm "$archive".part*
          done
          for f in public/audio/*voice-clips-*.tar.gz.b64; do
            [ -e "$f" ] || continue
            base64 -d "$f" > /tmp/clips.tar.gz
            case "$(basename "$f")" in
              # Story asset tarballs carry story/... paths and extract at the audio root.
              *voice-clips-story-*) tar -xzf /tmp/clips.tar.gz -C public/audio/ ;;
              *) tar -xzf /tmp/clips.tar.gz -C public/audio/speech/ ;;
            esac
            rm "$f"
          done
      - name: Commit decoded clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode staged clip archives" || echo "nothing to commit"
          git push
