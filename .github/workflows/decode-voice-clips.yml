name: Apply store tap fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified store tap changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = store-scroll-dragclick
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff 18e8a3a71c6f9de0b1089638a33d6f15f144a462 || test "$(git diff --name-only --diff-filter=U)" = .github/workflows/ci.yml
          echo '' | base64 -d | tar -xz
          git add -A
          git diff --cached --check
          git commit -m "Restore store taps after scrolling and integrate main"
          git push origin HEAD:store-scroll-dragclick
