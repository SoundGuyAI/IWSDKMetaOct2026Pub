name: Deploy dist payloads to gh-pages

on:
  push:
    branches:
      - gh-pages
    paths:
      - 'dist-payload-final.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payloads and swap site content
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-payload-*.tar.gz.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'no dist payloads present; aborting without changes'
            exit 1
          fi
          mkdir -p __dist_new
          for f in "${files[@]}"; do
            echo "decoding $f"
            base64 -d "$f" | tar xzf - -C __dist_new
          done
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '__dist_new' -exec rm -rf {} +
          cp -a __dist_new/. .
          rm -rf __dist_new dist-payload-*.tar.gz.b64
      - name: Commit deployed site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'Deploy rebuilt site to gh-pages'
            git push
          fi
