name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e-desktop:
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    name: Build and deploy GitHub Pages
    needs: [build-and-typecheck, e2e-desktop]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to the gh-pages branch
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add --force __ghpages origin/gh-pages
          find __ghpages -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a dist/. __ghpages/
          cd __ghpages
          git add -A
          if git diff --cached --quiet; then
            echo 'site content unchanged; skipping deploy'
          else
            git commit -m "Deploy dist from main@${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request a GitHub Pages build
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub docs say GITHUB_TOKEN pushes do not trigger Pages builds
          # (observed to trigger anyway in this repo, 2026-11-05). Request the
          # build explicitly so the site updates under either behavior.
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds" -X POST \
            || echo '::warning::explicit Pages build request failed; relying on the push-triggered build'
