name: CI

on:
  pull_request:
  push:
    branches: [main, ray-aware-panel]
  workflow_dispatch:
    # Merge-ready procedure (enduring rule, applies to every merge):
    # 1. Copy the PR head SHA from the PR page.
    # 2. Actions > CI > Run workflow on the PR branch, paste it as expected_sha.
    #    The run fails fast if the branch moved, then merges current main into
    #    that head and tests the COMBINED tree (failing with instructions if
    #    main does not merge cleanly).
    # 3. At merge time compare the current PR head against the SHA the green
    #    run tested AND check main has not advanced since that run. If either
    #    moved, re-dispatch instead of merging.
    # Cloudflare side note (Nov 8): Workers Builds has Build watch paths
    # excluding pr-preview/*, so gh-pages preview-publish commits no longer
    # trigger failing builds there; source-branch builds are unaffected.
    # The exclusion must exist under BOTH the Production and the Previews
    # Base tabs - gh-pages publishes are preview builds.
    inputs:
      expected_sha:
        description: 'Merge-ready check: the PR head SHA this run must test (copy it from the PR page). The run fails fast if the branch has moved.'
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check which validations are needed
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
      gameplay: ${{ steps.filter.outputs.gameplay }}
    steps:
      # On workflow_dispatch github.sha is the branch head itself (unlike
      # pull_request, where it is a merge-preview commit), so this compares the
      # exact commit the requester saw on the PR page against what will be
      # tested. This guards the dispatch moment only: a push landing AFTER a
      # green run does not invalidate it, so merging also requires comparing
      # the current PR head against the tested SHA at merge time (see todo.md).
      - name: A merge-ready dispatch must test the exact head it was asked for
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "${{ github.sha }}" != "${{ inputs.expected_sha }}" ]; then
            echo "::error::Branch moved since this run was requested: expected ${{ inputs.expected_sha }} but the branch head is ${{ github.sha }}. Re-run Actions > CI > Run workflow with the current PR head SHA."
            exit 1
          fi
          echo "Dispatch head matches requested SHA ${{ github.sha }}."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect the changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Default to publishing and full testing for manual runs and
          # unavailable history.
          publish=true
          gameplay=true
          range=''
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] && [ -n "$BASE" ]; then
            range="$BASE..$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = 'push' ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then
            git diff --no-renames --name-only -z "$range" > changed-paths.bin
            # Pages deploy is only worth running when a non-Markdown file changed.
            publish=$(python3 -c 'import pathlib; paths=pathlib.Path("changed-paths.bin").read_bytes().split(b"\0"); print(str(any(p and not p.endswith(b".md") for p in paths)).lower())')
            # Gameplay e2e only matters when a file that can affect gameplay
            # changed. Docs and the Wrangler deploy config cannot.
            gameplay=$(python3 -c 'import pathlib; paths=pathlib.Path("changed-paths.bin").read_bytes().split(b"\0"); print(str(any(p and not (p.endswith(b".md") or p == b"wrangler.jsonc") for p in paths)).lower())')
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "gameplay=$gameplay" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            echo 'Markdown-only change; skipping Pages build and publish. Validation still runs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$gameplay" = false ]; then
            echo 'Docs/Wrangler-config-only change; skipping gameplay e2e. Build and typecheck still run.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test tests/unit/*.test.mjs
      - run: npm run typecheck
      - run: node --test tests/unit/*.test.mjs
      - run: npm run build

  e2e-desktop:
    # Test-frequency policy (user, November 8): gameplay e2e runs on the FIRST
    # push of a PR (opened), on every main push (safety net for the deployed
    # result), and as a merge-ready run via Actions > CI > Run workflow on the
    # PR branch. The merge-ready run merges current main into the tested head
    # first (see the merge step below), so main advancing after the PR opened
    # is always covered by a fresh e2e against the combined code. Intermediate
    # PR pushes (synchronize) skip it and rely on the final dispatch plus
    # local runs (`npm run test:e2e`) before every push, keeping runner-minutes
    # proportional to review rounds instead of push count.
    runs-on: ubuntu-latest
    needs: [changes, build-and-typecheck]
    if: >-
      needs.changes.outputs.gameplay == 'true'
      && (github.event_name != 'pull_request' || github.event.action == 'opened')
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            files: tests/e2e/wall-tones.economy.spec.ts
          - shard: 2
            files: tests/e2e/wall-tones.desktop.spec.ts tests/e2e/wall-tones.desktop.pointer.spec.ts
          - shard: 3
            files: tests/e2e/wall-tones.head-caption.spec.ts tests/e2e/wall-tones.accessibility.spec.ts tests/e2e/wall-tones.feedback.spec.ts tests/e2e/wall-tones.loading.spec.ts tests/e2e/wall-tones.misc.spec.ts tests/e2e/wall-tones.mute.spec.ts tests/e2e/wall-tones.polish.spec.ts tests/e2e/wall-tones.xr-entry.spec.ts
    name: e2e-desktop (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Merge-ready dispatches test the COMBINED result: the exact PR head
      # (guarded by expected_sha in the changes job) merged with the current
      # main. main moving after the PR opened can change behavior without
      # touching the PR head, so a head-only green is not enough to merge on.
      # On pull_request events checkout already yields GitHub's merge-preview
      # commit, and on main pushes there is nothing to merge.
      - name: Merge current main into the tested head (merge-ready runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.email ci@localhost
          git config user.name CI
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            echo "::error::main does not merge cleanly into ${{ inputs.expected_sha }}. Update the branch onto current main, then re-dispatch with the new head SHA."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser first (downloads from the Playwright CDN, no apt). System
      # packages are installed through apt only when Chromium cannot launch
      # without them, and apt is retried, because apt mirrors failing DNS
      # lookups (Nov 11: three runs died at "apt-get update") must not stop
      # the whole suite. No test is skipped or changed.
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npx playwright install chromium
          launch_check() {
            node -e "require('@playwright/test').chromium.launch().then(b=>b.close()).catch(e=>{console.error(e.message.split('\\n')[0]);process.exit(1)})"
          }
          if launch_check; then
            echo 'Chromium launches without extra system packages.'
          else
            ok=false
            for attempt in 1 2 3 4; do
              if sudo apt-get update -o Acquire::Retries=5 && npx playwright install-deps chromium; then ok=true; break; fi
              echo "apt attempt $attempt failed; retrying"
              sleep $((attempt * 20))
            done
            [ "$ok" = true ] || { echo '::error::Could not install Chromium system packages after 4 attempts.'; exit 1; }
            launch_check
          fi
      - run: npm run build
      # Serial per runner (workers: 1) because gameplay timing and audio are
      # global to a page. Groups are split by measured CI duration (run
      # 42421269922): economy and the desktop journeys dominate, so the heavy
      # files each get a runner and the lighter files share the third. Keep
      # the file lists here and in the coverage check below in sync.
      - run: npm run test:e2e -- ${{ matrix.files }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  e2e-coverage:
    name: Check every e2e spec is assigned to a shard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gameplay == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          ls tests/e2e/*.spec.ts | sort > actual.txt
          printf '%s\n' \
            tests/e2e/wall-tones.accessibility.spec.ts \
            tests/e2e/wall-tones.desktop.pointer.spec.ts \
            tests/e2e/wall-tones.desktop.spec.ts \
            tests/e2e/wall-tones.economy.spec.ts \
            tests/e2e/wall-tones.head-caption.spec.ts \
            tests/e2e/wall-tones.feedback.spec.ts \
            tests/e2e/wall-tones.loading.spec.ts \
            tests/e2e/wall-tones.misc.spec.ts \
            tests/e2e/wall-tones.mute.spec.ts \
            tests/e2e/wall-tones.polish.spec.ts \
            tests/e2e/wall-tones.xr-entry.spec.ts \
            | sort > assigned.txt
          diff actual.txt assigned.txt || {
            echo '::error::Every tests/e2e/*.spec.ts file must be listed in the e2e-desktop matrix (and here).'
            exit 1
          }

  deploy-pages:
    name: Build and deploy GitHub Pages
    needs: [changes, build-and-typecheck, e2e-desktop, e2e-coverage]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.outputs.publish == 'true'
      && (needs.e2e-desktop.result == 'success' || needs.e2e-desktop.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to the gh-pages branch
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --force __ghpages origin/gh-pages
          find __ghpages -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'pr-preview' -exec rm -rf {} +
          cp -a dist/. __ghpages/
          cd __ghpages
          git add -A
          if git diff --cached --quiet; then
            echo 'site content unchanged; skipping deploy'
          else
            git commit -m "Deploy dist from main@${GITHUB_SHA::7}"
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages; then break; fi
              [ "$attempt" = 3 ] && exit 1
              git fetch origin gh-pages
              git rebase origin/gh-pages
            done
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the Pages build published this commit
        if: steps.publish.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          # Docs say GITHUB_TOKEN pushes do not trigger Pages builds, but in
          # this repo they provably do (runs 42045872517 and 42025039498 on
          # 2026-11-05, each created ~3s after a github-actions[bot] push with
          # that push as head_sha). Verify instead of assuming: fail loudly if
          # no successful "pages build and deployment" run appears for the
          # commit we just pushed, so a silent no-deploy can never look green.
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            row=$(gh api 'repos/{owner}/{repo}/actions/runs?branch=gh-pages&per_page=10' \
              | jq -r --arg sha "$TARGET" \
                '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha)] | first | if . == null then "" else ((.conclusion // "pending") + " " + (.id | tostring)) end')
            case "$row" in
              success*) echo "Pages build ${row#* } published $TARGET"; exit 0 ;;
              failure*|cancelled*|timed_out*|action_required*)
                echo "::error::Pages build for $TARGET ended as ${row%% *} (run ${row#* })"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::No Pages build run appeared for $TARGET within 8 minutes; the push did not trigger publishing"
          exit 1
