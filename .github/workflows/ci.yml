name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check which validations are needed
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
      gameplay: ${{ steps.filter.outputs.gameplay }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect the changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Default to publishing and full testing for manual runs and
          # unavailable history.
          publish=true
          gameplay=true
          range=''
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] && [ -n "$BASE" ]; then
            range="$BASE..$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = 'push' ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then
            git diff --no-renames --name-only -z "$range" > changed-paths.bin
            # Pages deploy is only worth running when a non-Markdown file changed.
            publish=$(python3 -c 'import pathlib; paths=pathlib.Path("changed-paths.bin").read_bytes().split(b"\0"); print(str(any(p and not p.endswith(b".md") for p in paths)).lower())')
            # Gameplay e2e only matters when a file that can affect gameplay
            # changed. Docs and the Wrangler deploy config cannot.
            gameplay=$(python3 -c 'import pathlib; paths=pathlib.Path("changed-paths.bin").read_bytes().split(b"\0"); print(str(any(p and not (p.endswith(b".md") or p == b"wrangler.jsonc") for p in paths)).lower())')
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "gameplay=$gameplay" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            echo 'Markdown-only change; skipping Pages build and publish. Validation still runs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$gameplay" = false ]; then
            echo 'Docs/Wrangler-config-only change; skipping gameplay e2e. Build and typecheck still run.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e-desktop:
    runs-on: ubuntu-latest
    needs: [changes, build-and-typecheck]
    if: needs.changes.outputs.gameplay == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Serial per shard (workers: 1) because gameplay timing and audio are
      # global to a page; sharding splits the suite across three runners.
      - run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    name: Build and deploy GitHub Pages
    needs: [changes, build-and-typecheck, e2e-desktop]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.outputs.publish == 'true'
      && (needs.e2e-desktop.result == 'success' || needs.e2e-desktop.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to the gh-pages branch
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --force __ghpages origin/gh-pages
          find __ghpages -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'pr-preview' -exec rm -rf {} +
          cp -a dist/. __ghpages/
          cd __ghpages
          git add -A
          if git diff --cached --quiet; then
            echo 'site content unchanged; skipping deploy'
          else
            git commit -m "Deploy dist from main@${GITHUB_SHA::7}"
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages; then break; fi
              [ "$attempt" = 3 ] && exit 1
              git fetch origin gh-pages
              git rebase origin/gh-pages
            done
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the Pages build published this commit
        if: steps.publish.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          # Docs say GITHUB_TOKEN pushes do not trigger Pages builds, but in
          # this repo they provably do (runs 42045872517 and 42025039498 on
          # 2026-11-05, each created ~3s after a github-actions[bot] push with
          # that push as head_sha). Verify instead of assuming: fail loudly if
          # no successful "pages build and deployment" run appears for the
          # commit we just pushed, so a silent no-deploy can never look green.
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            row=$(gh api 'repos/{owner}/{repo}/actions/runs?branch=gh-pages&per_page=10' \
              | jq -r --arg sha "$TARGET" \
                '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha)] | first | if . == null then "" else ((.conclusion // "pending") + " " + (.id | tostring)) end')
            case "$row" in
              success*) echo "Pages build ${row#* } published $TARGET"; exit 0 ;;
              failure*|cancelled*|timed_out*|action_required*)
                echo "::error::Pages build for $TARGET ended as ${row%% *} (run ${row#* })"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::No Pages build run appeared for $TARGET within 8 minutes; the push did not trigger publishing"
          exit 1
