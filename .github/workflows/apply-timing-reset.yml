name: Apply timing fault reset
on:
  push:
    branches: [feat/timing-fault-pattern-reset]
    paths: [".github/workflows/apply-timing-reset.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply edits
        run: |
          python3 - <<'PY'
          p='src/wall-tones/sequence.ts'
          s=open(p).read()
          s=s.replace("  streak = 0;\n  bestStreak = 0;","  streak = 0;\n  /** Completed patterns carried over from before a timing-fault reset. Streak = carried + current pattern length. */\n  private carriedStreak = 0;\n  bestStreak = 0;",1)
          s=s.replace("    this.sequence.length = 0;\n    this.inputStep = 0;\n    this.streak = 0;\n  }","    this.sequence.length = 0;\n    this.inputStep = 0;\n    this.streak = 0;\n    this.carriedStreak = 0;\n  }",1)
          s=s.replace("    this.streak = 0;\n    this.appendRandomPad();\n  }","    this.streak = 0;\n    this.carriedStreak = 0;\n    this.appendRandomPad();\n  }\n\n  /** Timing-fault reset: start a fresh one-note pattern, keep the earned streak and best. Score, owned savers and story progress are held elsewhere and untouched. */\n  restartPatternKeepStreak(): void {\n    this.carriedStreak = this.streak;\n    this.sequence.length = 0;\n    this.inputStep = 0;\n    this.appendRandomPad();\n  }",1)
          s=s.replace("this.streak = this.sequence.length;","this.streak = this.carriedStreak + this.sequence.length;")
          open(p,'w').write(s)
          p='src/wall-tones/wall-tones-system.ts'
          s=open(p).read()
          old="if (window) await this.playCypherWindow(window, narrIntact);\nelse {"
          new="if (window) {\nawait this.playCypherWindow(window, narrIntact);\n// Timing-fault beat: next pattern starts fresh at one note. Streak, score, owned savers and story progress stay.\nif (window.fault && narrIntact()) this.game.restartPatternKeepStreak();\n} else {"
          assert old in s
          s=s.replace(old,new,1)
          open(p,'w').write(s)
          PY
          cat > tests/unit/timing-fault-reset.test.mjs <<'JS'
          import { test } from 'node:test';
          import assert from 'node:assert/strict';
          import ts from 'typescript';
          import { readFileSync } from 'node:fs';

          const source = readFileSync(new URL('../../src/wall-tones/sequence.ts', import.meta.url), 'utf8');
          const js = ts.transpileModule(source, { compilerOptions: { module: ts.ModuleKind.ESNext, target: ts.ScriptTarget.ES2022 } }).outputText;
          const { WallTonesSequence } = await import('data:text/javascript;base64,' + Buffer.from(js).toString('base64'));

          function complete(game) {
            for (let i = 0; i < game.sequence.length; i += 1) game.onCorrectInput();
          }

          test('timing-fault reset starts a one-note pattern and keeps streak and best', () => {
            const g = new WallTonesSequence();
            g.startNewRun();
            for (let i = 0; i < 5; i += 1) complete(g);
            assert.equal(g.streak, 5);
            g.restartPatternKeepStreak();
            assert.equal(g.sequence.length, 1);
            assert.equal(g.inputStep, 0);
            assert.equal(g.streak, 5);
            assert.equal(g.bestStreak, 5);
          });

          test('after a reset the streak keeps counting from the kept value', () => {
            const g = new WallTonesSequence();
            g.startNewRun();
            for (let i = 0; i < 5; i += 1) complete(g);
            g.restartPatternKeepStreak();
            complete(g);
            assert.equal(g.streak, 6);
            complete(g);
            assert.equal(g.streak, 7);
            assert.equal(g.bestStreak, 7);
          });

          test('a wrong note after a reset still ends the run normally', () => {
            const g = new WallTonesSequence();
            g.startNewRun();
            for (let i = 0; i < 5; i += 1) complete(g);
            g.restartPatternKeepStreak();
            g.onWrongInput();
            assert.equal(g.streak, 0);
            assert.equal(g.sequence.length, 1);
            complete(g);
            assert.equal(g.streak, 1);
          });
          JS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src tests
          git commit -m "Timing-fault beat starts a fresh one-note pattern, keeping streak, score and story progress"
          git push
