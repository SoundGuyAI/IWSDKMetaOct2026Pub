name: PR preview

# Builds same-repo pull requests with non-Markdown changes and publishes them to
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# on the gh-pages branch, next to (never replacing) the production site.
# The CI deploy job keeps the pr-preview/ folder when it republishes main.
# Closing the PR removes its folder. Fork PRs are skipped (no write token).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # Manual rebuild of an existing PR's preview (Actions tab > PR preview > Run workflow).
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to (re)build the preview for
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check whether a preview build is needed
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Ignore Markdown-only pull requests
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          # An explicit manual rebuild always remains available.
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Read every page, not just the first 100 changed files.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed-files.txt
          if grep -qvE '\.md$' changed-files.txt; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Markdown-only pull request; skipping preview build and publish.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-preview:
    name: Build and publish PR preview
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Manual runs only build same-repo PRs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_repo=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #${PR_NUMBER} comes from ${head_repo}, not this repository; refusing to build fork code with a write token"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages under pr-preview/
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git worktree prune
            rm -rf __ghpages
            git worktree add --force --detach __ghpages origin/gh-pages
            dest="__ghpages/pr-preview/pr-${PR_NUMBER}"
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -a dist/. "$dest"/
            cd __ghpages
            git add -A
            if git diff --cached --quiet; then
              echo 'preview unchanged'
              break
            fi
            git commit -m "Preview PR #${PR_NUMBER} at ${GITHUB_SHA::7}"
            if git push origin HEAD:gh-pages; then
              break
            fi
            cd ..
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          echo "Preview: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/pr-preview/pr-${PR_NUMBER}/" >> "$GITHUB_STEP_SUMMARY"

  remove-preview:
    name: Remove PR preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete pr-preview/pr-N from gh-pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git worktree prune
            rm -rf __ghpages
            git worktree add --force --detach __ghpages origin/gh-pages
            cd __ghpages
            rm -rf "pr-preview/pr-${PR_NUMBER}"
            git add -A
            if git diff --cached --quiet; then
              echo 'nothing to remove'
              break
            fi
            git commit -m "Remove preview for PR #${PR_NUMBER}"
            if git push origin HEAD:gh-pages; then
              break
            fi
            cd ..
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
