<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="./wall-tones-icon.svg" type="image/svg+xml" />
    <title>Wall Tones 2: too fast to wall</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #081019;
      }

      #scene-container {
        width: 100vw;
        height: 100vh;
      }
      #audio-start-gate:not([hidden]) {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        background: #081019;
        color: white;
        font-family: system-ui, sans-serif;
      }
      .audio-start-card { text-align: center; }
      #audio-start-button {
        min-width: 220px;
        min-height: 64px;
        padding: 16px 40px;
        border: 0;
        border-radius: 16px;
        background: #f5d90a;
        color: #1c1d20;
        font: 700 24px system-ui, sans-serif;
        touch-action: manipulation;
      }
      #audio-start-button:disabled { opacity: 0.6; }
      #wt-loading {
        position: fixed;
        inset: 0;
        z-index: 100002;
        display: grid;
        place-items: center;
        background: #081019;
        color: white;
        font-family: system-ui, sans-serif;
        transition: opacity 0.3s ease;
      }
      .wt-loading-card { text-align: center; }
      .wt-loading-card h1 { font-size: 28px; margin: 0 0 18px; }
      #wt-loading-spin {
        width: 36px;
        height: 36px;
        margin: 0 auto 14px;
        border: 4px solid rgba(255, 255, 255, 0.25);
        border-top-color: #f5d90a;
        border-radius: 50%;
        animation: wt-spin 0.9s linear infinite;
      }
      @keyframes wt-spin {
        to { transform: rotate(360deg); }
      }
      #wt-loading-msg { margin: 0; color: rgba(255, 255, 255, 0.75); }
      #wt-loading-error p { color: #ffb4b4; margin: 0 0 14px; }
      #wt-retry {
        min-width: 180px;
        min-height: 52px;
        padding: 12px 32px;
        border: 0;
        border-radius: 14px;
        background: #f5d90a;
        color: #1c1d20;
        font: 700 18px system-ui, sans-serif;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="wt-loading">
      <div class="wt-loading-card">
        <h1>Wall Tones 2</h1>
        <div id="wt-loading-spin" aria-hidden="true"></div>
        <p id="wt-loading-msg">Loading...</p>
        <div id="wt-loading-error" hidden>
          <p>Could not finish loading. Check your connection and try again.</p>
          <button id="wt-retry" type="button">Retry</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var overlay = document.getElementById('wt-loading');
        var spin = document.getElementById('wt-loading-spin');
        var msg = document.getElementById('wt-loading-msg');
        var errBox = document.getElementById('wt-loading-error');
        var done = false;
        function fail() {
          if (done) return;
          done = true;
          clearTimeout(timer);
          spin.style.display = 'none';
          msg.style.display = 'none';
          errBox.hidden = false;
        }
        var timer = setTimeout(fail, 30000);
        // The app calls this once its menu is interactive.
        window.__wtAppReady = function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          overlay.style.opacity = '0';
          setTimeout(function () {
            overlay.remove();
          }, 350);
        };
        // A failed module/script fetch (e.g. a stale tab after a new deploy)
        // surfaces as a resource error on a SCRIPT element.
        window.addEventListener(
          'error',
          function (event) {
            if (!done && event.target && event.target.tagName === 'SCRIPT') {
              fail();
            }
          },
          true,
        );
        document
          .getElementById('wt-retry')
          .addEventListener('click', function () {
            location.reload();
          });
      })();
    </script>
    <div id="audio-start-gate" hidden>
      <div class="audio-start-card">
        <h1>Wall Tones</h1>
        <button id="audio-start-button" type="button">Start</button>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
